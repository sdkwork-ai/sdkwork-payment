# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/payment/webserver.pid;
error_log /var/log/sdkwork/payment/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name payment-demo.sdkwork.com payment-demo.birdcoder.com payment-demo.dtupay.com payment-demo.noaper.com payment-demo.sdkwork.cn payment-demo.birdcoder.cn payment-demo.dtupay.cn payment-demo.noaper.cn payment-demo.skubc.com payment-demo.skubc.cn payment-demo.zowalk.com payment-demo.zowalk.cn payment-demo.offer86.com payment-demo.offer86.cn payment-demo.86offer.com payment-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/payment/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
