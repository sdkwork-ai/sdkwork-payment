# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/payment/webserver.pid;
error_log /var/log/sdkwork/payment/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name payment-dev.sdkwork.com payment-dev.birdcoder.com payment-dev.dtupay.com payment-dev.sdkwork.cn payment-dev.birdcoder.cn payment-dev.dtupay.cn payment-dev.skubc.com payment-dev.skubc.cn payment-dev.zowalk.com payment-dev.zowalk.cn payment-dev.offer86.com payment-dev.offer86.cn payment-dev.86offer.com payment-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
